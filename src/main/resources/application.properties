spring.application.name=Bio_Backend
# === Config PostgreSQL - a copier/adapter dans src/main/resources/application.properties ===

spring.datasource.url=jdbc:postgresql://localhost:5432/bioconversion_db
spring.datasource.username=postgres
spring.datasource.password=2000@
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update : Hibernate cree/adapte les tables automatiquement
# a partir des entites @Entity. Pratique en developpement.
# ATTENTION : ne JAMAIS utiliser "update" ou "create" en production,
# utiliser plutot un outil de migration (Flyway/Liquibase) plus tard.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# === Module Securite (2026-09-18, durci le 2026-09-22) : JWT ===
# jwt.secret lit maintenant la variable d'environnement JWT_SECRET si elle
# existe (syntaxe Spring ${NOM_VAR:valeur_par_defaut}), et retombe sinon sur
# la valeur de dev ci-dessous -- donc ca continue de marcher sans rien
# configurer en local, mais en production il suffit de definir la variable
# d'environnement JWT_SECRET (jamais de la committer) pour que ce fichier
# n'ait plus besoin de contenir le vrai secret.
jwt.secret=${JWT_SECRET:cL8Dk7vF3enaTgZbrbuBjcQjt5lkwCysprosO/Q8kcF2HWam0HQm/oFvf7CuxVRk}
# Duree de vie d'un token, en millisecondes : ici 24h (86 400 000 ms).
jwt.expiration-ms=86400000

# === Commission plateforme (ajoute le 2026-09-24, retour client) ===
# Taux applique au montant d'un paiement REUSSI (voir PaiementService.confirmerPaiement()).
# Pas de vrai prelevement/versement (pas de portefeuille Mobile Money) -- seulement
# calcule et trace sur le Paiement, et agrege dans GET /api/admin/statistiques.
plateforme.commission.taux=0.05
